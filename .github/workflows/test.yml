name: PySAT Tests
on: [push]
jobs:
  build:
    name: Python 3.15 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      # prepare.py applies solver patches through WSL on Windows.
      - name: Set up WSL for Windows solver patches
        if: runner.os == 'Windows'
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-22.04
          wsl-version: '1'
          set-as-default: 'true'
          additional-packages: patch

      - name: Set up Python 3.15
        uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest setuptools wheel
      - name: Build and install wheel
        run: |
          python setup.py bdist_wheel
          pip install dist/*.whl
      - name: Test with pytest
        run: |
          pytest
